# THIS IS THE CONFIGURATION FILE FOR ReadMateStatusModbus and ChangeMateStatusModbus scripts
# remaked lines with "#" are used only for comments
# do not delete parameters or sections

#-------------------------------------------------------------------
[Path] 
# output_path      # default = "" -- output/input data (json, logs) location - leave it blank to use default location (./data), set your path if you need other location
# duplicate_active # default = false -- this option is used only by ReadMateStatus
# duplicate_path   # if duplicate_active is 'true' the 'status.json' is saved in a second location; setting the duplicate_path is mandatory in these case

output_path       =
#output_path      =\\192.168.0.100\web\mate3_homeassistant\data 
#output_path      =/volume1/web/mate3_homeassistant/data
#output_path      =/media/web/mate3_homeassistant/data
#output_path      =/mnt/web/mate3_homeassistant/data

duplicate_active  =true
#duplicate_path   =\\192.168.0.100\docker\home-assistant\www\data
duplicate_path   =/volume1/docker/home-assistant/www/data

#-------------------------------------------------------------------
[MATE3 connection] 
mate3_ip         =192.168.0.150
mate3_modbus     =502

#-------------------------------------------------------------------
[Maria DB connection]

# SQL_active       # default = false    -- set true if you need to activate SQL data upload
# host             # SQL server address -- 192.168.0.100 for Synology, 127.0.0.1 for localDB (Raspberry)
# db_port          # default= 3306 -- SQL server port, 3307 MariaDB Synology, 3306 MariaDB Raspberry
# user             # SQL server user name 
# password         # SQL server password
# database         # SQL server MonitorMate database name
# database1        # SQL server weather database name - used for prediction

SQL_active       =false
host             =192.168.0.100
db_port          =3307
user             =yourusername 
password         =yourpassword
database         =mate3_mod

#-------------------------------------------------------------------
[MQTT]
# settings for MQTT to be used for Home Assistant transmision set false if not needed

#MQTT_active                       # default = true -- set 'true' if you have MQTT broker up and running
#MQTT_discovery_active             # default = true  -- set 'false' to keep MQTT data publishing but disable Home Assistant MQTT Discovery
#MQTT_discovery_cleanup            # default = false -- set 'true' to remove Home Assistant entities this script no longer publishes.
#                                    Discovery messages are retained by the broker, so a sensor that stops being applicable - after a
#                                    shunt role change or an inverter swap - stays in Home Assistant showing a stale value until it is
#                                    cleared. Left 'false' those sensors are only reported in the log and nothing is deleted.
#MQTT_broker                       # mqtt broker address -- ex: 192.168.0.100
#MQTT_username                     # your mqtt username or leave it blank if no authentication required
#MQTT_password                     # your mqtt password or leave it blank if no authentication required
#MQTT_availability_threshold       # default = 0 -- HA sensor availability after consecutive MATE3 communication failures
#                                  # 0 = disabled, HA sensors remain available
#                                  # 1 = HA sensors become unavailable after the first failed cycle
#                                  # N = HA sensors become unavailable after N consecutive failed cycles

MQTT_active            =true
MQTT_discovery_active  =true
MQTT_discovery_cleanup =false
MQTT_broker            =192.168.0.100
MQTT_port              =1883
MQTT_username          =
MQTT_password          =
MQTT_availability_threshold  =0

#-------------------------------------------------------------------
[Labels]
# HUB port labels - map physical Mate HUB ports to user-friendly names
# Leave blank to use default label Port1 ... Port8
port_1 = VFXR3048
port_2 = FM60
port_3 = FM80
port_4 = VFXR3048
port_5 = FNDC
port_6 =
port_7 =
port_8 =

# FLEXnet-DC shunt labels - free text, used for display only
shunt_a = Solar
shunt_b = Invertor
shunt_c = Diverter

# FLEXnet-DC shunt roles - what each shunt is actually wired to
# The FNDC cannot report this, so the calculated summary values need to be told.
# Valid roles: solar, charger, inverter, load, diverter, unused, other
#   solar / charger  - current normally flows into the battery, reported positive while charging
#   inverter / load / diverter - current normally flows out, reported positive while drawing
#   unused           - shunt is not connected, left out of the battery current total
#   other            - measured for the battery total but not reported as a total of its own
# A summary value is published for each role in use, as shunt_<role>_current and shunt_<role>_power.
# Leave all three blank to keep the previous behaviour, where shunt C was assumed to be a diverter.
shunt_a_role =
shunt_b_role =
shunt_c_role =

#-------------------------------------------------------------------
[General]
# Runtime mode
# daemon_active   # default = true -- set 'true' to run continuously; set 'false' for one scan only (cron/task scheduler mode)
# scan_frequency  # default = 60    -- delay between scans in seconds, used only when daemon_active is true

daemon_active     =true
scan_frequency    =60

# LOG setup
LOGGING_LEVEL_FILE     # default = "INFO" --set to "DEBUG" only for debug purpose   
LOGGING_FILE_MAX_SIZE  # default = 1000   -- unit is KB, set as you consider
LOGGING_FILE_MAX_FILES # default = 1      -- number of rotating log file, 0 - one log unlimited filesize, 1 - one rotating log with file set above, 2 - two ...

LOGGING_LEVEL_FILE     =INFO
LOGGING_FILE_MAX_SIZE  =1000
LOGGING_FILE_MAX_FILES =1